<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Examination Portal - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  
  <header class="navbar">
    <div class="nav-brand">
      
      <span class="brand-text">Online Examination Portal</span>
    </div>
    <a href="#" class="btn-register">Register</a>
  </header>

 
  <main>
    <div class="login-layout">

     
      <div class="welcome-container">
        <div class="welcome-text-group">
          <h1 class="welcome-heading">Welcome Back!</h1>
          <p class="welcome-subtext">Login to your account to start your examination.</p>
        </div>
        <div class="welcome-illustration">
          <img src="phto.png" alt="Online Examination Illustration" class="exam-img">
        </div>
      </div>

      
      <div class="login-card-container">
        <div class="login-card">
          <h2 class="card-title">Login</h2>

          <form action="dashboard.html" method="GET">
            <div class="form-group">
              <label for="rollNumber" class="form-label">Username / Roll Number</label>
              <input 
                type="text" 
                id="rollNumber" 
                name="rollNumber" 
                class="form-input" 
                placeholder="Enter your username or roll number" 
                required
              >
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <div class="password-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-input" 
                  placeholder="Enter your password" 
                  required
                >
                <span class="password-toggle">&#128065;</span>
              </div>
            </div>

            <button type="submit" class="btn-login-submit">Login</button>

            <div class="form-footer">
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
