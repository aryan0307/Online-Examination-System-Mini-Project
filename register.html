<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Examination Portal - Register</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <span class="brand-text">Online Examination Portal</span>
    </div>
    <a href="login.html" class="btn-nav">Login</a>
  </header>

  <main class="main-content">
    <div class="register-card-container">
      <div class="register-card">
        <h2 class="card-title">Student Registration</h2>

        <form action="login.html" method="GET">
          <div class="form-group">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="rollNumber" class="form-label">University Roll Number</label>
            <input type="text" id="rollNumber" name="rollNumber" class="form-input" placeholder="Enter university roll number" required>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Official Email ID</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email address" required>
          </div>

          <div class="form-group">
            <label for="department" class="form-label">Department / Branch</label>
            <select id="department" name="department" class="form-select" required>
              <option value="">Select your branch</option>
              <option value="cse">Computer Science & Engineering</option>
              <option value="aids">AI & Data Science</option>
              <option value="it">Information Technology</option>
              <option value="ece">Electronics & Communication</option>
            </select>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Create Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Re-enter your password" required>
          </div>

          <button type="submit" class="btn-submit">Register</button>

          <div class="form-footer">
            <p>Already registered? <a href="login.html" class="footer-link">Back to Login</a></p>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
